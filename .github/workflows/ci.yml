name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: Test and build Better UI (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run offline tests
        run: npm test

      - name: Verify production bundle builds
        run: npm run build

  webview2-build:
    name: Compile and verify WebView2 host (isolated)
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Verify pinned WebView2 SDK and compile in a disposable fixture
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\coupled-workspace-webview2\Ensure-WebView2Sdk.ps1
          & .\tools\coupled-workspace-webview2\Test-IsolatedBuild.ps1

      - name: Verify settings safety under real Windows file failures
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\coupled-workspace-webview2\Test-WorkspaceSettingsPhysicalIo.ps1
