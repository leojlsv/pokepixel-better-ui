name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Validate and publish release artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Require release tag to belong to main history
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Validate source and production bundle
        run: npm run validate

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Verify tag, version and distributable metadata
        run: npm run release:check -- "$GITHUB_REF_NAME"

      - name: Generate SHA-256 checksum
        run: (cd dist && sha256sum pokepixel-better-ui.user.js > pokepixel-better-ui.user.js.sha256)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/pokepixel-better-ui.meta.js
          dist/pokepixel-better-ui.user.js
          dist/pokepixel-better-ui.user.js.sha256
          --verify-tag
          --generate-notes
          --title "Better UI $GITHUB_REF_NAME"
