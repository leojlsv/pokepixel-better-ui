<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pokémon Profile QA</title>
  <link rel="stylesheet" href="../../src/styles/tokens.css">
  <link rel="stylesheet" href="../../src/styles/base.css">
  <link rel="stylesheet" href="../../src/styles/components.css">
  <link rel="stylesheet" href="../../src/styles/states.css">
  <style data-preview-host-fidelity>
    * { box-sizing:border-box; }
    html,body { min-height:100%; margin:0; background:#161d20; color:#eef1df; font-family:var(--ppbui-font-body); }
    body { padding:8px; }
    .pokeidle-top-toolbar { display:flex; gap:4px; min-height:36px; padding:4px; border:1px solid var(--ppbui-line); border-radius:var(--ppbui-window-radius); background:var(--ppbui-surface-window); }
    .pokeidle-top-toolbar__btn { min-height:28px; border:1px solid var(--ppbui-line); border-radius:var(--ppbui-control-radius); background:var(--ppbui-surface-interactive); color:var(--ppbui-text); font:700 11px/1 var(--ppbui-font-body); }
    .preview-note { margin:8px 0; color:var(--ppbui-text-muted); font:10px/1.2 var(--ppbui-font-body); }
    .demo-grid { display:grid; grid-template-columns:repeat(4,minmax(0,92px)); gap:8px; opacity:.72; }
    .demo-pokemon { display:grid; gap:4px; padding:6px; border:1px solid var(--ppbui-line); border-radius:var(--ppbui-control-radius); background:var(--ppbui-surface-interactive); color:var(--ppbui-text); font:700 10px/1 var(--ppbui-font-body); }
    .demo-pokemon img { width:54px; height:54px; justify-self:center; object-fit:contain; image-rendering:pixelated; }
    .pokemon-card { width:360px; margin-top:10px; padding:10px; border:1px solid var(--ppbui-line); border-radius:var(--ppbui-window-radius); background:var(--ppbui-surface-window); color:var(--ppbui-text); font:11px/1.25 var(--ppbui-font-body); }
    .pokemon-tooltip__header { display:grid; grid-template-columns:64px minmax(0,1fr); gap:10px; align-items:center; padding-bottom:8px; border-bottom:1px solid var(--ppbui-line); }
    .pokemon-tooltip__portrait { display:grid; width:64px; height:64px; place-items:center; border:1px solid var(--ppbui-line); border-radius:var(--ppbui-radius); background:var(--ppbui-surface-interactive); }
    .pokemon-tooltip__portrait img { width:58px; height:58px; object-fit:contain; image-rendering:pixelated; }
    .pokemon-tooltip__identity { display:grid; gap:4px; }
    .pokemon-tooltip__identity strong { color:#f3d45f; font-size:16px; }
    .pokemon-tooltip__badges { display:flex; gap:4px; align-items:center; margin:8px 0; }
    .pokemon-tooltip__badge { padding:5px 8px; border:1px solid var(--ppbui-line); border-radius:var(--ppbui-radius-badge); background:var(--ppbui-surface-interactive); font-weight:700; }
    .pokemon-tooltip__badge.is-level { border-color:#2aa1c4; background:#0d5368; }
    .pokemon-tooltip__badge.is-quality { background:#80600f; }
    .pokemon-tooltip__badge.is-power { border-color:#d2b45d; color:#ffe27a; }
    .pokemon-card__meters { display:grid; gap:6px; padding:8px; border:1px solid var(--ppbui-line); border-radius:var(--ppbui-radius); background:var(--ppbui-surface-values); }
    .pokemon-card__meter-head { display:flex; justify-content:space-between; font-weight:700; }
    .pokemon-card__track { height:8px; border:1px solid var(--ppbui-line); border-radius:var(--ppbui-radius); background:var(--ppbui-surface-values); }
    .pokemon-card__track i { display:block; height:100%; background:#6fb658; }
    .pokemon-card__cells { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:8px; }
    .pokemon-card__cell { display:grid; gap:4px; min-height:58px; padding:9px; border:1px solid var(--ppbui-line); border-radius:var(--ppbui-radius); background:var(--ppbui-surface-values); }
    .pokemon-card__cell-label,.pokemon-card__title { color:#d8d9c2; font-weight:700; letter-spacing:.05em; text-transform:uppercase; }
    .pokemon-card__cell-value { color:#fff3ad; font-size:14px; }
    .pokemon-card__section { display:grid; gap:6px; margin-top:8px; padding-top:8px; border-top:1px solid var(--ppbui-line); }
    .pokemon-card__section .pokemon-card__title { margin:0; color:#f3d45f; }
    .pokemon-card__rows { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .pokemon-card__rows-col { display:grid; gap:4px; }
    .pokemon-card__row { display:flex; justify-content:space-between; border-bottom:1px solid var(--ppbui-line); }
    .pokemon-card__actions { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:5px; margin-top:10px; }
    .pokemon-card__action { min-height:32px; border:1px solid var(--ppbui-line); border-radius:var(--ppbui-control-radius); background:var(--ppbui-surface-interactive); color:var(--ppbui-text); font:700 10px/1 var(--ppbui-font-body); }
    .pokemon-card__action.is-profile { border-color:#d2b45d; color:#ffe27a; }

    /* Host fidelity pressure: the native layer may attempt a thicker Element edge.
       The Profile module is mounted after this fixture and must retain 1px ownership. */
    [data-ppbui-profile-choice-element],
    [data-ppbui-profile-type-icon],
    [data-ppbui-profile-move-element] { border-width:2px!important; }
  </style>
</head>
<body class="pokeidle-app">
  <div class="pokeidle-top-toolbar"><button type="button" class="pokeidle-top-toolbar__btn" data-menu-id="team"><span class="pokeidle-top-toolbar__label">Team</span></button><button type="button" class="pokeidle-top-toolbar__btn" data-menu-id="inventory"><span class="pokeidle-top-toolbar__label">Backpack</span></button></div>
  <div class="preview-note">Render local representativo · Profile dedicado · dados simulados, componentes reais</div>
  <div class="demo-grid" aria-label="Contextos de Pokémon">
    <button class="demo-pokemon" data-ppbui-pokemon-profile-source data-creature-id="bag-1"><img data-demo="rhydon" alt=""><span>Rhydon · Backpack</span></button>
    <button class="demo-pokemon" data-ppbui-pokemon-profile-source data-creature-id="team-1"><img data-demo="gengar" alt=""><span>Gengar · Team HUD</span></button>
    <button class="demo-pokemon" data-ppbui-pokemon-profile-source data-creature-id="team-2"><img data-demo="gyarados" alt=""><span>Gyarados · Team</span></button>
  </div>
  <script src="/work/pokemon-profile-preview-bundle.js"></script>
</body>
</html>
